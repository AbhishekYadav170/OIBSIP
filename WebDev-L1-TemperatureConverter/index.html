<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="converter-card">

            <div class="header">
                <div class="icon">🌡️</div>
                <h1>Temperature Converter</h1>
                <p>Convert temperatures quickly and easily</p>
            </div>

            <div class="converter-form">

                <div class="form-group">
                    <label for="temperature">Enter Temperature</label>

                    <input
                        type="number"
                        id="temperature"
                        placeholder="Enter temperature value"
                        step="any"
                    >
                </div>

                <div class="form-group">
                    <label for="unit">Select Unit</label>

                    <select id="unit">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>

                <button id="convertBtn" type="button">
                    Convert Temperature
                </button>

                <p id="errorMessage" class="error-message"></p>

            </div>

            <div class="results">

                <h2>Conversion Results</h2>

                <div class="result-grid">

                    <div class="result-box">
                        <span class="result-icon">°C</span>
                        <div>
                            <p>Celsius</p>
                            <h3 id="celsiusResult">--</h3>
                        </div>
                    </div>

                    <div class="result-box">
                        <span class="result-icon">°F</span>
                        <div>
                            <p>Fahrenheit</p>
                            <h3 id="fahrenheitResult">--</h3>
                        </div>
                    </div>

                    <div class="result-box">
                        <span class="result-icon">K</span>
                        <div>
                            <p>Kelvin</p>
                            <h3 id="kelvinResult">--</h3>
                        </div>
                    </div>

                </div>

            </div>

            <div class="footer">
                <p>Built with HTML, CSS & JavaScript</p>
            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
